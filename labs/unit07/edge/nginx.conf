# CPS 5981 · Unit 07 · edge proxy (baseline configuration — do not edit before Task 4)
events { worker_connections 1024; }

http {
  log_format unit07 '$time_iso8601 "$request" status=$status '
                    'upstream=$upstream_addr ustatus=$upstream_status rt=$request_time';
  access_log /var/log/nginx/access.log unit07;
  error_log  /var/log/nginx/error.log warn;

  # Layer 1: two replicas. If one refuses connections, nginx retries the other.
  upstream juice {
    server juice-a:3000 max_fails=1 fail_timeout=10s;
    server juice-b:3000 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 80;

    proxy_connect_timeout 2s;
    proxy_read_timeout    15s;
    proxy_next_upstream   error timeout http_502 http_503;
    add_header X-Served-By $upstream_addr always;

    # Static health indicator; it does not test upstream services.
    location = /edge-health { access_log off; return 200 "edge ok\n"; }

    # Shared identity provider.
    location = /_auth {
      internal;
      proxy_pass              http://idp:8081/validate;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length "";
      proxy_connect_timeout   2s;
      proxy_read_timeout      2s;
    }

    location /api/  { auth_request /_auth; proxy_pass http://juice; }
    location /rest/ { auth_request /_auth; proxy_pass http://juice; }

    # Public front end; no identity check.
    location / { proxy_pass http://juice; }
  }
}
